d for thousands of years. 在一块古地毯上看到的图案，几千年过去，颜色依然鲜活。","creator":{"@id":"https://www.verazhang.com/#vera"},"artform":"Painting","isPartOf":{"@id":"https://www.verazhang.com/art#gallery"}},{"@type":"VisualArtwork","@id":"https://www.verazhang.com/art#horse","name":"Horse","alternateName":"马","image":"https://www.verazhang.com/art/horse.jpg","description":"An abstract impression of a horse. 一匹马的抽象印象。","creator":{"@id":"https://www.verazhang.com/#vera"},"artform":"Painting","isPartOf":{"@id":"https://www.verazhang.com/art#gallery"}},{"@type":"VisualArtwork","@id":"https://www.verazhang.com/art#flower-purple","name":"Flower Purple","alternateName":"紫色背景的花","image":"https://www.verazhang.com/art/flower-purple.jpg","description":"Sometimes teal goes with purple. 有时候，青色也配紫色。","creator":{"@id":"https://www.verazhang.com/#vera"},"artform":"Painting","isPartOf":{"@id":"https://www.verazhang.com/art#gallery"}},{"@type":"VisualArtwork","@id":"https://www.verazhang.com/art#eye","name":"Eye","alternateName":"眼","image":"https://www.verazhang.com/art/eye.jpg","description":"When the storm comes, you'll want to be at the eye of it. 风暴来临时，你会想待在风暴的中心。","creator":{"@id":"https://www.verazhang.com/#vera"},"artform":"Painting","isPartOf":{"@id":"https://www.verazhang.com/art#gallery"}},{"@type":"VisualArtwork","@id":"https://www.verazhang.com/art#face","name":"Face","alternateName":"脸","image":"https://www.verazhang.com/art/face.jpg","description":"This face keeps coming back in my dreams. 这张脸，总在我的梦里出现。","creator":{"@id":"https://www.verazhang.com/#vera"},"artform":"Painting","isPartOf":{"@id":"https://www.verazhang.com/art#gallery"}},{"@type":"VisualArtwork","@id":"https://www.verazhang.com/art#friends","name":"Friends","alternateName":"朋友","image":"https://www.verazhang.com/art/friends.jpg","description":"Holding hands is communication. 牵手，是一种交流。","creator":{"@id":"https://www.verazhang.com/#vera"},"artform":"Painting","isPartOf":{"@id":"https://www.verazhang.com/art#gallery"}},{"@type":"VisualArtwork","@id":"https://www.verazhang.com/art#back","name":"Back","alternateName":"背影","image":"https://www.verazhang.com/art/back.jpg","description":"Every person stays in someone else's line of sight. 每个人，都活在另一个人的视线里。","creator":{"@id":"https://www.verazhang.com/#vera"},"artform":"Painting","isPartOf":{"@id":"https://www.verazhang.com/art#gallery"}},{"@type":"VisualArtwork","@id":"https://www.verazhang.com/art#kiss","name":"Kiss","alternateName":"吻","image":"https://www.verazhang.com/art/kiss.jpg","description":"You're the love of my life. 你是我此生所爱。","creator":{"@id":"https://www.verazhang.com/#vera"},"artform":"Painting","isPartOf":{"@id":"https://www.verazhang.com/art#gallery"}},{"@type":"VisualArtwork","@id":"https://www.verazhang.com/art#self-portrait","name":"Self Portrait","alternateName":"自画像","image":"https://www.verazhang.com/art/self-portrait.jpg","description":"If I could, I'd listen to music all day. 可以的话，我想一整天听音乐。","creator":{"@id":"https://www.verazhang.com/#vera"},"artform":"Painting","isPartOf":{"@id":"https://www.verazhang.com/art#gallery"}},{"@type":"VisualArtwork","@id":"https://www.verazhang.com/art#moon","name":"Dancing over the Moon","alternateName":"在月球上跳舞","image":"https://www.verazhang.com/art/moon.jpg","description":"A simple wish — what if we could live without gravity? 一个小小的愿望——如果我们可以不被重力束缚。","creator":{"@id":"https://www.verazhang.com/#vera"},"artform":"Painting","isPartOf":{"@id":"https://www.verazhang.com/art#gallery"}},{"@type":"VisualArtwork","@id":"https://www.verazhang.com/art#autumn","name":"Autumn","alternateName":"秋","image":"https://www.verazhang.com/art/autumn.jpg","description":"Warm colors. 暖色调。","creator":{"@id":"https://www.verazhang.com/#vera"},"artform":"Painting","isPartOf":{"@id":"https://www.verazhang.com/art#gallery"}},{"@type":"VisualArtwork","@id":"https://www.verazhang.com/art#ballet","name":"Ballet","alternateName":"芭蕾","image":"https://www.verazhang.com/art/ballet.jpg","description":"Dancing can be qui o.jpg"/><figcaption class="sr-only">A painting hung above the sofa in my studio. 工作室沙发角上方挂着的一幅画。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Corner Three / 角落 三" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/corner-three.jpg"/><figcaption class="sr-only">The sunny side of the studio. 工作室的阳光面。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Abstraction One / 抽象 一" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/abstraction-one.jpg"/><figcaption class="sr-only">Where water flows naturally, art appears. 水自然流淌，便成艺术。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Abstraction Two / 抽象 二" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/abstraction-two.jpg"/><figcaption class="sr-only">I like to stand under the sunshine. 我喜欢站在阳光下。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Abstraction Three / 抽象 三" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/abstraction-three.jpg"/><figcaption class="sr-only">A simple mix of colors creates a glow that pulls you into deeper thought. 几种颜色相混便有了光，让人沉入更深的思绪。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Abstraction Four / 抽象 四" loading="lazy" width="300" height="250 d home a lot, staring out the window every afternoon, waiting for my parents to come back from work. 小时候我常常一个人在家，每天下午盯着窗外，等爸爸妈妈下班回来。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Childhood Two / 童年 二" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/childhood-two.jpg"/><figcaption class="sr-only">I dreamed a lot as a kid. Now I want to paint them all. 小时候做过很多梦，现在我想把它们都画出来。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Childhood Three / 童年 三" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/childhood-three.jpg"/><figcaption class="sr-only">Pool trips were the best part of being a kid. 去游泳池玩，是小时候最开心的事。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Childhood Four / 童年 四" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/childhood-four.jpg"/><figcaption class="sr-only">Every Spring Festival is a memory I hold close. 每一年的春节，都是我珍藏的记忆。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Philosophy One / 哲学 一" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/philosophy-one.jpg"/><figcaption class="sr-only">Pretty and Ugly. 美与丑。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Philosophy Two / 哲学 二" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/philosophy-two.jpg"/><figcaption class="sr-only">Truth and Falsehood. 真与假。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Philosophy Three / 哲学 三" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/philosophy-three.jpg"/><figcaption class="sr-only">Good and Evil. 善与恶。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Hue One / 色调 一" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/hue-one.jpg"/><figcaption class="sr-only">A self portrait. 我的自画像。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Hue Two / 色调 二" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/hue-two.jpg"/><figcaption class="sr-only">A girl in a hat. 戴帽子的女孩。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Hue Three / 色调 三" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/hue-three.jpg"/><figcaption class="sr-only">A Chinese girl in red. 穿红衣的中国女孩。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Hue Four / 色调 四" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/hue-four.jpg"/><figcaption class="sr-only">Blue is the ultimate color. 蓝色是终极的颜色。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Hue Five / 色调 五" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/hue-five.jpg"/><figcaption class="sr-only">A girl in a yellow shirt. 穿黄衬衫的女孩。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Hue Six / 色调 六" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/hue-six.jpg"/><figcaption class="sr-only">Purple is one of the hardest colors to paint. 紫色，是最难画的颜色之一。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Hue Seven / 色调 七" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/hue-seven.jpg"/><figcaption class="sr-only">Orange can be an intense color. 橙色可以很有力量。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Sidewalk / 路边" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/sidewalk.jpg"/><figcaption class="sr-only">I saw this on a sidewalk — the old man&#x27;s peaceful face stayed with me, so I painted it. 在路边看见的一幕，老人脸上的安宁让我久久不能忘，便画了下来。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Chain / 链" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/chain.jpg"/><figcaption class="sr-only">I saw this pattern on an ancient carpet. The colors had stayed vivid for thousands of years. 在一块古地毯上看到的图案，几千年过去，颜色依然鲜活。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Horse / 马" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/horse.jpg"/><figcaption class="sr-only">An abstract impression of a horse. 一匹马的抽象印象。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Flower Purple / 紫色背景的花" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/flower-purple.jpg"/><figcaption class="sr-only">Sometimes teal goes with purple. 有时候，青色也配紫色。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Eye / 眼" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/eye.jpg"/><figcaption class="sr-only">When the storm comes, you&#x27;ll want to be at the eye of it. 风暴来临时，你会想待在风暴的中心。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Face / 脸" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/face.jpg"/><figcaption class="sr-only">This face keeps coming back in my dreams. 这张脸，总在我的梦里出现。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Friends / 朋友" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/friends.jpg"/><figcaption class="sr-only">Holding hands is communication. 牵手，是一种交流。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Back / 背影" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/back.jpg"/><figcaption class="sr-only">Every person stays in someone else&#x27;s line of sight. 每个人，都活在另一个人的视线里。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Kiss / 吻" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/kiss.jpg"/><figcaption class="sr-only">You&#x27;re the love of my life. 你是我此生所爱。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Self Portrait / 自画像" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/self-portrait.jpg"/><figcaption class="sr-only">If I could, I&#x27;d listen to music all day. 可以的话，我想一整天听音乐。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Dancing over the Moon / 在月球上跳舞" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/moon.jpg"/><figcaption class="sr-only">A simple wish — what if we could live without gravity? 一个小小的愿望——如果我们可以不被重力束缚。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Autumn / 秋" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/autumn.jpg"/><figcaption class="sr-only">Warm colors. 暖色调。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Ballet / 芭蕾" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/ballet.jpg"/><figcaption class="sr-only">Dancing can be quiet. 舞蹈，也可以很安静。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Abstraction Six / 抽象 六" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/abstraction-six.jpg"/><figcaption class="sr-only">A classic green and pink. 经典的绿配粉。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Face Two / 脸 二" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/face-two.jpg"/><figcaption class="sr-only">A mask is the truest view of how I really feel. 面具，才是我表情最真实的样子。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Guitar / 吉他" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/guitar.jpg"/><figcaption class="sr-only">A man playing guitar. 一个男人在弹吉他。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Abstraction Seven / 抽象 七" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/abstraction-seven.jpg"/><figcaption class="sr-only">I sat there, picking colors and filling in the blocks. Time passed. 我坐着，挑颜色，填色块，时间慢慢过去。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Blind Piano / 钢琴" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/blind-piano.jpg"/><figcaption class="sr-only">Painted a piano with my eyes closed. 闭着眼睛画了一架钢琴。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Hat / 帽子" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/hat.jpg"/><figcaption class="sr-only">Fashion is simple. 时尚很简单。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Coffee / 咖啡" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/coffee.jpg"/><figcaption class="sr-only">I need coffee every morning. 我每天早上都需要咖啡。</figcaption></figure><figure class="bg-white p-6 w-full h-full flex flex-col items-center justify-center shadow-md relative"><img alt="Spaces / 空间" loading="lazy" width="300" height="250" decoding="async" data-nimg="1" class="w-full h-auto object-contain cursor-pointer" style="color:transparent" src="/art/spaces.jpg"/><figcaption class="sr-only">How do you know the person you meet every day is still the same person? 你怎么知道，你每天遇见的那个人，还是同一个人？</figcaption></figure><
